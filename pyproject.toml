[project]
name = "market-radar"
version = "0.2.0"
description = "Local market radar: rotation, momentum, regime and holdings signals"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
    "platformdirs>=4",
    "mcp>=2.3",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]
# screenshots and the PDF in marketing/ (scripts/marketing.py); drives the installed Microsoft Edge
marketing = [
    "playwright>=1.58",
]

[tool.pytest.ini_options]
markers = [
    "network: talks to the real sources (live contract checks); deselected unless run with -m network",
    "os: touches what differs between operating systems (file replacing, locks, paths); CI also runs these on Windows and macOS",
    "slow: runs a study on real-size data (decades of months); deselected unless run with -m slow (CI runs both)",
]
addopts = "-m 'not network and not slow'"

# Layers between the app and the studies (docs/architecture.md, *Layers*); `uv run lint-imports`, also run by
# tests/test_layers.py. Forbidden contracts count indirect imports too, including imports inside functions.
[tool.importlinter]
root_package = "radar"

[[tool.importlinter.contracts]]
name = "The kernel (radar.model) stands on its own: no studies, no app, no report"
type = "forbidden"
source_modules = ["radar.model"]
forbidden_modules = [
    "radar.backtest", "radar.reporting", "radar.api", "radar.cli", "radar.updater",
    "radar.propose", "radar.abtest", "radar.mcp",
]

[[tool.importlinter.contracts]]
name = "The studies (radar.backtest) read data, not the report builder or the app"
type = "forbidden"
source_modules = ["radar.backtest"]
forbidden_modules = ["radar.reporting", "radar.api", "radar.cli", "radar.mcp", "radar.mine", "radar.profile"]

[[tool.importlinter.contracts]]
name = "The app reads the studies' reports (model.artifacts), never runs a study"
type = "forbidden"
source_modules = ["radar.updater", "radar.reporting", "radar.api", "radar.abtest", "radar.propose", "radar.xray",
                  "radar.agenda", "radar.evidence", "radar.attribution", "radar.tax", "radar.studyrun", "radar.mcp"]
forbidden_modules = ["radar.backtest"]

[[tool.importlinter.contracts]]
# Top to bottom; a module imports its own layer and below (":" = the modules of a layer may import each other).
# Every top-level module needs a layer. No exceptions (ignore_imports): what a module needs from above is passed
# in, or the shared piece moves down.
name = "The whole package in layers: interfaces, features, the kernel, the domain, data sources, pure readings, infrastructure"
type = "layers"
containers = ["radar"]
exhaustive = true
layers = [
    "__main__ : api : cli : mcp",
    "abtest : agenda : api_models : attribution : backtest : evidence : health : mine : profile : propose : reporting : studyrun : tax : updater : xray",
    "model",
    "datahome : guide : importers : market : market_views : notebook : portfolios : snapshot : universe : userstore",
    "discovery : fundamentals : sources : updates",
    "signals",
    "config : config_schema : errors : guard : jsonsafe : locks : manifest : money : net : ops : paths : sourcelog : values",
]

# The linter (CI runs `uv run ruff check`). Lint only, no formatter: the code keeps its own layout.
[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = [
    "B008",    # typer.Option / FastAPI Query defaults are calls by design
    "B905",    # zip() without strict=: the lengths are equal by construction where it is used
    "E731",    # a one-line lambda for a local helper is house style
    "SIM105",  # try/except/pass reads as plainly as contextlib.suppress
    "SIM108",  # ternaries only where they read better
    "SIM401",  # `x[k] if k in x else None` on DataFrames: .get isn't obviously the same
]

# A complexity budget: no function grows past this (ruff's McCabe count). The few above it carry `noqa: C901`
# with why; that list only shrinks.
[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pycodestyle]
max-line-length = 140   # 120 is the aim (isort wraps there); a line may run over when splitting it reads worse

[tool.ruff.lint.isort]
known-first-party = ["radar"]

[tool.ruff.lint.per-file-ignores]
"src/radar/cli/*.py" = ["B904"]   # `raise typer.Exit(message)` inside except: the message is the whole report
"src/radar/datahome/export.py" = ["E501"]   # EXPORT.md's Markdown table rows can't be wrapped

# Coverage (CI: `uv run pytest -q --cov`, which fails below fail_under). The floor is the total after the last
# tranche minus two, rounded down (thread timing moves a run by a point or two): 89.5 % after Tranche 10. Raise it
# as coverage rises; never lower it to let a change in.
[tool.coverage.run]
source = ["radar"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = false
sort = "cover"
fail_under = 87

# Type checking (CI runs `uv run mypy`): all of src/radar, with the bodies of unannotated functions checked too.
# pandas has no stubs here, so it is Any. Next rung: disallow_incomplete_defs, package by package.
[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src/radar"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

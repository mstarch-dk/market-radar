[project]
name = "market-radar"
version = "0.1.0"
description = "Local market radar: rotation, momentum, regime and holdings signals"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "plotly>=5.20",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[project]
name = "market-radar"
version = "0.2.0"
description = "Local market radar: rotation, momentum, regime and holdings signals"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pdfplumber>=0.11.10",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
    "platformdirs>=4",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# screenshots and the PDF in marketing/ (scripts/marketing.py); drives the installed Microsoft Edge
marketing = [
    "playwright>=1.58",
]

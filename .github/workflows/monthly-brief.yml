name: Monthly market brief

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month, 06:00 UTC
  workflow_dispatch:       # run on demand from the Actions tab or `gh workflow run monthly-brief.yml`

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: monthly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set date
        run: echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Restore holdings
        env:
          HOLDINGS_BUNDLE: ${{ secrets.HOLDINGS_BUNDLE }}
        run: uv run radar unbundle-holdings

      - name: Refresh data and build radar
        run: uv run radar run

      - name: Write brief with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Write this month's market brief by following .claude/skills/market-brief/SKILL.md.
            The data refresh has already run: skip step 1, and do not run `uv run radar run` again.
            Read reports/summary.json, do the web research and write briefs/${{ env.TODAY }}.md.
            Don't commit, push or open a PR. A later workflow step handles that.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(uv run radar info:*),Bash(ls:*),Bash(cat:*)"

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-dashboard
          path: reports/
          retention-days: 90

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today="$TODAY"
          if [ ! -f "briefs/$today.md" ]; then echo "No brief was written"; exit 1; fi
          branch="brief/$today"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "briefs/$today.md" data/snapshots/
          git commit -m "Market brief $today"
          git push -u origin "$branch"
          tldr=$(awk '/^## TL;DR/{f=1;next} /^## /{f=0} f' "briefs/$today.md")
          gh pr create --base main --head "$branch" --title "Market brief $today" \
            --body "$(printf '%s\n\n📊 Dashboard: download the **radar-dashboard** artifact from [this run](%s).\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' \
              "$tldr" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"

name: CI

# Every pull request and every push to main: ruff, mypy on the typed modules, the tests with coverage (offline:
# tests/conftest.py refuses network access), the guide's checks, and the web app. Ubuntu only for now: Windows
# (where file replacing and locking behave differently) took several times as long; add windows-latest back to
# the matrix to test there again.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Types (the modules listed in pyproject.toml [tool.mypy] files)
        run: uv run mypy
      - run: uv run lint-imports
      - name: Tests, with coverage (reported, no floor yet)
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: The slow tests (studies on real-size data)
        run: uv run pytest -q -m slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web test
      - run: pnpm -C web build
      - name: The API types match the server's models
        run: |
          pnpm -C web gen:api
          git diff --exit-code web/src/api/schema.ts

name: CI

# Every pull request and every push to main: ruff, mypy on the typed modules, the tests with coverage (offline:
# tests/conftest.py refuses network access), the guide's checks, and the web app. The whole suite runs on Ubuntu;
# the tests marked `os` (file replacing, locks, the data folder, backups and paths with a space and an ø) also run
# on Windows and macOS, where the app runs too. A full Windows run took several times as long.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emails:
    # every commit's author and committer is a noreply address: the repo is public, and a merge or edit on
    # github.com uses the account's email unless GitHub's email privacy is on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Commit emails are noreply addresses
        shell: bash
        run: |
          ok=' ([0-9]+\+)?[A-Za-z0-9-]+@users\.noreply\.github\.com$| noreply@github\.com$| noreply@anthropic\.com$'
          bad=$(git log --format='%h %ae%n%h %ce' | grep -v -E "$ok" | sort -u || true)
          if [ -n "$bad" ]; then
            echo "Commits with an email that isn't a noreply address:"
            echo "$bad"
            exit 1
          fi
          echo "All $(git rev-list --count HEAD) commits use noreply addresses."

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Types (the modules listed in pyproject.toml [tool.mypy] files)
        run: uv run mypy
      - run: uv run lint-imports
      - name: Tests, with coverage (the floor is fail_under in pyproject.toml)
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: The slow tests (studies on real-size data)
        run: uv run pytest -q -m slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: The tests that touch the operating system (marker `os`)
        run: uv run pytest -q -m "os and not network and not slow"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web test
      - run: pnpm -C web build
      - name: The API types match the server's models
        run: |
          pnpm -C web gen:api
          git diff --exit-code web/src/api/schema.ts

history_years: 3          # price history fetched for new tickers
constituents_max_age_days: 30

rotation:
  window: 14               # weeks used to normalise RS-Ratio / RS-Momentum
  tail: 8                  # weeks of trail shown on the rotation graph

momentum:
  top_n: 20                # leaders shown per region
  min_history_days: 200

regime:
  vix_calm: 18
  vix_stress: 25
  breadth_strong: 60       # % of stocks above 200-day average
  breadth_weak: 40
  highs_lows_band: 3       # net % of stocks at 52w highs: >= +band risk-on, <= -band risk-off
  vix_term_calm: 0.9       # VIX/VIX3M below this = calm; above 1 = inverted (stress)
  rates_shock: 0.5         # US 10Y up more than this (pct pts) in 3 months = risk-off
  copper_gold_band: 0.05   # copper/gold ratio 3m change beyond +-5% votes
  oil_shock: 0.30          # WTI up more than 30% in 3 months = risk-off
  revisions_band: 0.5      # FactSet: change in quarter's growth estimate (pct pts) beyond +-band votes

positioning:
  lookback_weeks: 156      # CFTC percentile window (3 years)
  extreme_pct: 10          # top/bottom 10% of that window = crowded

sectors:
  cluster_min: 3           # flag a sector/industry with at least this many names in a region's top N
  cluster_ratio: 1.5       # ... and at least this multiple of its share of the region

snapshot_min_gap_days: 5   # compare against a snapshot at least this old

stops:                     # rule-based stop / take-profit for holdings (signals/levels.py)
  atr_days: 14
  k_base: 3.0              # stop = highest close since entry - k x ATR
  k_min: 1.5
  k_max: 3.5
  k_step: 0.5              # each signal moves k by this (Mixed regime / target cuts by half)
  strong_score: 80         # momentum percentile that earns more room
  extended_vs_sma50: 0.25  # price this far above the 50d = extended, tighter stop
  reward_risk: 2.0         # take-profit candidate: last + 2 x stop distance
  near_atr: 1.0            # "near stop" / "near target" within this many ATRs
  min_analysts: 5          # analyst targets need at least this many opinions
  target_cut: 0.05         # mean target change over 30 days beyond +-5% is a signal
  info_anchor_days: 63     # `radar info` for a non-held ticker anchors on this window's high
  include: []              # theme funds outside etf_groups that should get levels too (broad index funds don't)

risk:                      # signals/risk.py: weekly returns in DKK
  windows: {1y: 52, 3y: 156}
  min_weeks: 26            # fewer weeks: no statistic (null), never a guess
  factors: [MTUM, VLUE, QUAL, USMV]   # factor ETFs for attribution (as tilts vs ACWI); only those with prices are used
  budget: 0.01             # risk budget: position size at which hitting the rule stop costs 1% of the portfolio

analyst:
  max_age_days: 7          # re-fetch Yahoo consensus for holdings/watchlist after this

coverage:                  # data transparency (coverage.py, "Data & coverage" tab)
  max_age:                 # days behind the report's as-of date before a source is stale and stops counting
    prices: 7
    fred: 14               # the broad USD index lags 1-2 weeks
    cftc: 14               # weekly, Tuesday positions published Friday
    factset: 14            # weekly
    oecd: 75               # monthly, published with a ~2-month lag
    analyst: 21            # Yahoo consensus used for take-profit levels
  blind_spots:             # what the radar does not see; shown on the page and in summary.json
    - "Valuation: no P/E, earnings yield or equity risk premium. Only analyst price targets, and only for holdings and watchlist."
    - "Flows and sentiment: no fund flows, sentiment surveys (AAII, fund manager survey), options positioning, short interest or insider activity."
    - "Earnings revisions cover the S&P 500 only (FactSet). Nothing for Europe, the Nordics or Asia."
    - "Macro and credit are mostly US (FRED). Europe is seen only through the OECD leading indicator and price trends."
    - "Company fundamentals (margins, balance sheets, guidance) are not modelled."
    - "The universe is a sample: US = today's S&P 500, so breadth history has survivorship bias; Europe, Nordic and Asia are curated lists."
    - "News, events, earnings dates and policy only enter through the web research in /market-brief."
    - "Yahoo data is unofficial and comes without a quality guarantee. All prices are end-of-day."

gauges:                    # graded readings (signals/gauges.py): colour by closeness to a threshold, not just a word
  # anchors: [value, score] points; score +1 = good/bullish/cheap (green), -1 = warning (red), interpolated between.
  # sequential gauges are one-way risk measures (scores 0..-1 only). labels: [upper bound, word], last bound null.
  # unit: pct for fractions shown as percentages (default num).
  rsi14:
    scale: diverging
    anchors: [[20, 1], [30, 0.6], [40, 0.15], [45, 0], [55, 0], [60, -0.15], [70, -0.6], [80, -1]]
    labels: [[30, oversold], [40, near oversold], [60, neutral], [70, near overbought], [80, overbought], [null, extremely overbought]]
    ticks: [30, 70]
    range: [0, 100]
  bb_pct_b:
    scale: diverging
    anchors: [[-0.1, 0.8], [0, 0.5], [0.35, 0], [0.65, 0], [1, -0.5], [1.1, -0.9]]
    labels: [[0, below lower band], [0.35, lower half], [0.65, mid band], [1, upper half], [null, above upper band]]
    ticks: [0, 1]
    range: [-0.2, 1.2]
  macd_atr:                # MACD histogram divided by ATR, so it compares across prices
    scale: diverging
    anchors: [[-0.5, -1], [-0.1, -0.3], [0, 0], [0.1, 0.3], [0.5, 1]]
    labels: [[-0.1, bearish], [0, fading], [0.1, turning up], [null, bullish]]
    ticks: [0]
    range: [-0.6, 0.6]
  atr_pct:
    scale: sequential
    unit: pct
    anchors: [[0.01, 0], [0.025, -0.2], [0.04, -0.5], [0.07, -1]]
    labels: [[0.015, calm], [0.03, normal], [0.05, volatile], [null, very volatile]]
    ticks: [0.025, 0.04]
    range: [0, 0.08]
  vol_surge:
    scale: sequential
    anchors: [[1, 0], [1.5, -0.3], [2.5, -0.8]]
    labels: [[1.3, normal volume], [2, elevated volume], [null, unusual volume]]
    ticks: [1, 1.5]
    range: [0, 3]
  from_high:
    scale: diverging
    unit: pct
    anchors: [[-0.35, -1], [-0.2, -0.4], [-0.1, 0], [-0.05, 0.3], [0, 0.6]]
    labels: [[-0.2, deep drawdown], [-0.1, pulled back], [-0.03, near high], [null, at 52w high]]
    ticks: [-0.2, -0.1]
    range: [-0.4, 0]
  beta:
    scale: sequential
    anchors: [[1, 0], [1.5, -0.4], [2, -0.8]]
    labels: [[0.8, defensive], [1.2, market-like], [1.7, high beta], [null, very high beta]]
    ticks: [1]
    range: [0, 2.5]
  score:
    scale: diverging
    anchors: [[0, -1], [25, -0.5], [40, 0], [60, 0], [80, 0.6], [95, 1]]
    labels: [[25, weak], [40, below average], [60, average], [80, strong], [null, leader]]
    ticks: [40, 60, 80]
    range: [0, 100]
  stop_dist:               # stop vs price (negative = stop below the price)
    scale: sequential
    unit: pct
    anchors: [[-0.15, 0], [-0.08, -0.2], [-0.04, -0.6], [-0.015, -1], [0, -1]]
    labels: [[-0.08, room to stop], [-0.04, tightening], [0, near stop], [null, through stop]]
    ticks: [-0.08, -0.04]
    range: [-0.2, 0]
  tp_dist:                 # take-profit vs price (positive = target above the price)
    scale: diverging
    unit: pct
    anchors: [[0, 1], [0.03, 0.7], [0.1, 0.3], [0.3, 0]]
    labels: [[0, at target], [0.03, near target], [0.1, approaching], [null, far from target]]
    ticks: [0.03, 0.1]
    range: [0, 0.4]
  upside:                  # analysts' mean target vs price
    scale: diverging
    unit: pct
    anchors: [[-0.2, -1], [-0.05, -0.4], [0, 0], [0.05, 0], [0.15, 0.4], [0.3, 1]]
    labels: [[-0.05, above targets], [0.05, at targets], [0.15, some upside], [null, well below targets]]
    ticks: [0, 0.15]
    range: [-0.3, 0.4]
  target_change:
    scale: diverging
    unit: pct
    anchors: [[-0.1, -1], [0, 0], [0.1, 1]]
    labels: [[-0.02, targets cut], [0.02, targets stable], [null, targets raised]]
    ticks: [0]
    range: [-0.15, 0.15]
  cot_pct:                 # crowding: graded by distance from the middle of the 3-year range
    scale: sequential
    abs_from: 50
    anchors: [[50, 0], [75, -0.2], [90, -0.6], [100, -1]]
    labels: [[10, crowded short], [25, leaning short], [75, normal], [90, leaning long], [null, crowded long]]
    ticks: [10, 50, 90]
    range: [0, 100]
  cli_chg:
    scale: diverging
    anchors: [[-0.5, -1], [0, 0], [0.5, 1]]
    labels: [[-0.1, slowing], [0.1, flat], [null, improving]]
    ticks: [0]
    range: [-0.8, 0.8]
  rs_ratio:
    scale: diverging
    anchors: [[97, -1], [100, 0], [103, 1]]
    labels: [[99, lagging], [101, even], [null, leading]]
    ticks: [100]
    range: [96, 104]
  rs_mom:
    scale: diverging
    anchors: [[98, -1], [100, 0], [102, 1]]
    labels: [[99.5, decelerating], [100.5, steady], [null, accelerating]]
    ticks: [100]
    range: [97, 103]
  excess_vs_acwi:          # holding's DKK return minus the shadow ACWI position's
    scale: diverging
    unit: pct
    anchors: [[-0.2, -1], [0, 0], [0.2, 1]]
    labels: [[-0.05, behind ACWI], [0.05, level with ACWI], [null, ahead of ACWI]]
    ticks: [0]
    range: [-0.4, 0.4]

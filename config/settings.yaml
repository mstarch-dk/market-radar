history_years: 10         # price history kept at least; deeper when your first trade needs it (backtest.warmup_days)
constituents_max_age_days: 30

rotation:
  window: 14               # weeks used to normalise RS-Ratio / RS-Momentum
  tail: 8                  # weeks of trail shown on the rotation graph

momentum:
  top_n: 20                # leaders shown per region
  min_history_days: 200

regime:
  vix_calm: 18
  vix_stress: 25
  breadth_strong: 60       # % of stocks above 200-day average
  breadth_weak: 40
  highs_lows_band: 3       # net % of stocks at 52w highs: >= +band risk-on, <= -band risk-off
  vix_term_calm: 0.9       # VIX/VIX3M below this = calm; above 1 = inverted (stress)
  rates_shock: 0.5         # US 10Y up more than this (pct pts) in 3 months = risk-off
  copper_gold_band: 0.05   # copper/gold ratio 3m change beyond +-5% votes
  oil_shock: 0.30          # WTI up more than 30% in 3 months = risk-off
  revisions_band: 0.5      # FactSet: change in quarter's growth estimate (pct pts) beyond +-band votes
  cape_rich_pct: 90        # Shiller CAPE percentile (monthly since 1871) at or above = stretched (risk-off)
  cape_cheap_pct: 10       # at or below = cheap (risk-on)
  erp_low_pct: 10          # Damodaran implied ERP percentile (monthly since 2008) at or below = thin premium (risk-off)
  erp_high_pct: 90         # at or above = ample premium (risk-on)
  momentum_payoff_band: 0.02  # momentum's top minus bottom score quintile over 3m beyond +-2% = paying / losing (display only)
  dispersion_low_pct: 20   # 3m return dispersion percentile (own history) at or below = narrow (display only)
  dispersion_high_pct: 80  # at or above = wide
  crash_rebound: 0.05      # ACWI up this much in a month after a negative 2 years = momentum-crash setup (display only)
  votes:                   # which indicator groups count in the vote (the Regime page can override this for you)
    credit_eu: true        # euro high-yield spread, next to the US one
    valuation: false       # CAPE and the equity risk premium: slow-moving, not a 1-6-month timing signal

positioning:
  lookback_weeks: 156      # CFTC percentile window (3 years)
  extreme_pct: 10          # top/bottom 10% of that window = crowded

sectors:
  cluster_min: 3           # flag a sector/industry with at least this many names in a region's top N
  cluster_ratio: 1.5       # ... and at least this multiple of its share of the region

snapshot_min_gap_days: 5   # compare against a snapshot at least this old

stops:                     # rule-based review level / stop / take-profit for holdings (signals/levels.py)
  mode: trend              # trend: the review level is the trend_sma-day average (`radar study exits`: the only exit that
                           # cost little return); atr: the trailing ATR stop below (the rule until 2026-10)
  trend_sma: 200
  action: review           # review: a close below the level is a reason to look at the position again, not a sell order
  take_profit: false       # true: the take-profit below (sold momentum's winners early: it cost the most in the study)
  atr_days: 14
  k_base: 3.0              # stop = highest close since entry - k x ATR
  k_min: 1.5
  k_max: 3.5
  k_step: 0.5              # each signal moves k by this (Mixed regime / target cuts by half)
  strong_score: 80         # momentum percentile that earns more room
  extended_vs_sma50: 0.25  # price this far above the 50d = extended, tighter stop
  reward_risk: 2.0         # take-profit candidate: last + 2 x stop distance
  near_atr: 1.0            # "near stop" / "near target" within this many ATRs
  min_analysts: 5          # analyst targets need at least this many opinions
  target_cut: 0.05         # mean target change over 30 days beyond +-5% is a signal
  info_anchor_days: 63     # `radar info` for a non-held ticker anchors on this window's high
  include: []              # theme funds outside etf_groups that should get levels too (broad index funds don't)

backtest:                  # `radar sim exits` (backtest/): the stop/take-profit rule replayed on your own trades
  warmup_days: 450         # price history kept before your first trade (200d average, 12-month momentum, ATR)
  max_years: 10            # never fetch prices further back than this
  fill: next               # next | same: sell at the next session's traded close after a close through a level
  park: ACWI               # where the money from a rule exit waits until your next buy
  fred_lag_days: 1         # a FRED value counts from the day after its date
  oecd_lag_days: 70        # OECD CLI is published about two months after its month
  valuation_lag_days: 30   # Shiller CAPE / Damodaran ERP monthly values
  fundamentals_lag_days: 1 # an EDGAR statement value counts from the day after its filing date
  fee_bps: 10              # cost of each simulated rule / parking / basket trade, in basis points of its value (commission + FX spread)
  study_holdout_from: 2024-10-01   # `radar study score`: formation dates from this day on are the holdout (never tuned on)
  study_min_names: 30      # a formation date needs at least this many ranked names with a forward return
  random_baskets: 1000     # `radar sim picks`: random baskets of the same size and caps drawn for the percentile

abtest:                    # src/radar/abtest.py: the forward A/B test (kvalitet+værdi vs momentum vs 50/50), from its start on
  n: 15                    # names per basket, equal weights, picked again once a month
  max_per_sector: 3        # at most this many from one sector in a basket
  capital: 100000          # DKK each basket starts with (virtual)
  value_score: qv          # the value basket ranks on qv (kvalitet + værdi) or value (værdiscore alone)

propose:                   # src/radar/propose.py: `radar propose` and /propose-portfolio (analysis, not advice)
  # --- the rule (pre-registered: a change here makes reports/propose-study.json stale; re-run `radar study propose`)
  min_ticket_dkk: 10000    # at least this much per new name (fees: a broker minimum on a small ticket costs a lot)
  max_names: 8             # never more new names than this in one proposal
  tilts:                   # the proposal score: weights on the momentum score and K+V (kvalitet + værdi) percentiles
    momentum: {momentum: 1.0, qv: 0.0}
    value: {momentum: 0.0, qv: 1.0}
    mix: {momentum: 0.5, qv: 0.5}
  require_trend_from: 0.5  # a tilt with at least this momentum weight only takes names in an uptrend (trend_ok)
  penalties:               # points taken off the 0-100 proposal score
    vol: 10                # × the name's volatility percentile in the pool (0-1)
    stretch: 5             # when the 1-month return is in the pool's top decile (a spike that often gives back)
    corr: 10               # × the name's correlation with the portfolio's weekly returns (when above 0)
  fill_gaps_bonus: 20      # mode fill-gaps: points × how far the name's sector is under ACWI's weight in the portfolio
  max_per_sector: 2        # new names per sector in one proposal
  caps:                    # active weight vs ACWI of the portfolio after the addition (sector, region, currency)
    sector: 0.25
    region: 0.40
    currency: 0.40
  max_corr: 0.7            # weekly-return correlation above this with a pick or a holding counts as the same bet
  gates:
    max_stale_days: 7      # last price older than this: left out
    min_history_weeks: 52
    min_adv_dkk: 5000000   # mean daily traded value over 20 sessions, in DKK
  exit:                    # the exits each pick gets (and the rule study replays)
    min_score: 50          # momentum tilts: a momentum score below this is a signal exit
    min_qv: 40             # value tilt: a K+V below this is a signal exit
    weakening: 0.05        # within this share of a level (price) or 5 points (scores): "weakening"
  # --- costs
  spread_bps:              # estimated half-spread by liquidity (mean daily traded value in DKK); an estimate
    - {min_adv_dkk: 500000000, bps: 3}
    - {min_adv_dkk: 50000000, bps: 8}
    - {min_adv_dkk: 0, bps: 20}
  study_cost_bps: 30       # the rule study's cost per trade (fee + FX + half-spread), each way
  # --- the model
  horizons: [3, 6]         # months
  study_ns: [3, 5, 8]      # basket sizes the rule study tests
  min_weeks: 26            # the bootstrap and the pool's correlation with the portfolio: fewer joint weeks, none
                           # (the covariance's own settings are under risk.covariance)
  acwi_drift_annual: 0.06  # an assumption, not a forecast: ACWI's expected return a year, to centre the bootstrap
  survivorship_haircut: 0.3  # share of a positive study excess taken off (today's universe flatters the past)
  haircut_from_gauge: true # a larger haircut when `radar study longrun`'s survivorship gauge implies one (never smaller)
  prior:                   # the long-run prior the rule study's excess is shrunk toward (backtest/longrun.tilt_prior)
    region: developed      # JKP region whose stocks give the prior; the others are shown beside it
    report_regions: [world_ex_us, usa]
    since: 2008-01-01      # the era after momentum's decay (= longrun.holdout_from): the conservative choice
    components:            # the tilt's inputs as JKP characteristics (top tercile less the mean of the three)
      momentum: [ret_12_1, ret_6_1]
      value: [fcf_me, ebitda_mev, eqnpo_me]   # FCF yield, EBITDA/EV, net payout (≈ shareholder) yield
      quality: [qmj]       # quality minus junk: profitability, growth, safety
    qv: {value: 0.5, quality: 0.5}   # K+V = the mean of the værdiscore and the kvalitetsscore
    tau_annual: 0.03       # extra prior uncertainty a year: a few of today's names are not a tercile of thousands
    trend_months: 10       # the prior in today's trend (ACWI vs its 10-month average) when that split has ...
    min_trend_eff_n: 20    # ... at least this many independent periods
  bootstrap: {draws: 5000, block_weeks: 4, seed: 7, ewma_lambda: 0.94}
  # --- the decision rule (pre-committed)
  min_edge: 0.01           # modelled excess over ACWI after costs, over the horizon, needed to propose stocks
  min_regime_dates: 12     # use the regime's own study figures only with this many dates in that regime
  max_swaps: 2             # judgment may replace at most this many of the rule's picks
  frontier_knee: 0.005     # basket size: the smallest n after which one more name cuts volatility by less than this
  # --- the account
  ask_deposit_cap: null    # aktiesparekonto: the year's deposit ceiling in DKK (fill in from skat.dk; null = not checked)
  ask_cap_year: null
  etf_filler: {ticker: SSAC.L, model: ACWI, name: "iShares MSCI ACWI UCITS (Acc)", isin: IE00B6R52259, min_dkk: 3000}
  review_min: 6            # `radar propose review`: fewer proposals than this are too few to judge anything by

risk:                      # signals/risk.py: weekly returns in DKK
  windows: {1y: 52, 3y: 156}
  min_weeks: 26            # fewer weeks: no statistic (null), never a guess
  factors: [MTUM, VLUE, QUAL, USMV]   # factor ETFs for attribution (as tilts vs ACWI); only those with prices are used
  budget: 0.01             # risk budget: position size at which hitting the rule stop costs 1% of the portfolio
  # --- the risk model of a set of holdings (portfolios/riskmodel.py): proposals and the portfolio X-ray share it
  covariance:              # weekly DKK returns of the holdings and ACWI
    history_weeks: 156
    min_weeks: 26          # a name with fewer weeks is left out of the model (listed as missing)
    shrink: 0.3            # this share pulled towards a constant-correlation matrix
  world_funds: [IWDA.AS, IWDA.L, SWDA.L, EUNL.DE, VWCE.DE, VWRL.AS, VWRL.L, ISAC.L, SPYI.DE]  # broad world funds
                           # counted with ACWI's weights (an approximation: MSCI World leaves out emerging markets)
  stress:                  # historical episodes replayed on today's weights (only where the price history covers them)
    - {key: covid, label: "Covid crash", start: 2020-02-19, end: 2020-03-23}
    - {key: rates2022, label: "2022 rate shock", start: 2022-01-03, end: 2022-10-12}
    - {key: unwind2024, label: "Summer 2024 momentum unwind", start: 2024-07-10, end: 2024-08-05}
    - {key: tariffs2025, label: "2025 tariff shock", start: 2025-02-19, end: 2025-04-08}
  xray:                    # the portfolio X-ray
    min_coverage: 0.5      # below this share of invested value in the risk model: no risk figures, only a note
    warn_coverage: 0.8     # below this: the figures are shown with a coverage warning
    pair_corr: 0.7         # pairs of holdings above this weekly correlation are listed as moving together

analyst:
  max_age_days: 7          # re-fetch Yahoo consensus for holdings/watchlist after this

calendar:                  # earnings dates of what you hold or watch (sources/external.py update_calendar, agenda.py)
  days: 35                 # the calendar's window (the monthly brief's too)
  soon_days: 7             # "the next 7 days" and the earnings-in-N-days flag
  stale_days: 10           # a read older than this doesn't set the date while the weekly screener has one
  include: {watchlist: true, ex_dividend: true, reviews: true}
  highlight:
    big_position: 0.05     # a holding at least this share of the selection's invested value
    near_level: 0.05       # last close within this distance of the review level (stop), above or below
    revision_cut: -0.02    # the quarter's EPS estimate changed by this or less over 30 days: a cut (the mirror: raised)
  refresh:
    max_age_days: 3        # read Yahoo's calendar again after this
    near_days: 14          # ... and, with a report this close,
    near_max_age_hours: 20 # after this many hours

coverage:                  # data transparency (coverage.py, "Data & coverage" tab)
  max_age:                 # days behind the report's as-of date before a source is stale and stops counting
    prices: 7
    fred: 14               # the broad USD index lags 1-2 weeks
    cftc: 14               # weekly, Tuesday positions published Friday
    factset: 14            # weekly
    oecd: 75               # monthly, published with a ~2-month lag
    analyst: 21            # Yahoo consensus used for take-profit levels
    calendar: 7            # earnings dates of holdings/watchlist (read every few days, daily near a report)
    discovery_universe: 45 # the discovery scan's list of names (re-built monthly)
    discovery_prices: 10   # the discovery scan's prices (run it weekly)
    valuation_stocks: 10   # weekly P/E and EPS-estimate snapshot (Yahoo screener)
    valuation_etfs: 10     # weekly ETF P/E snapshot (Yahoo fund data)
    cape: 45               # Shiller CAPE (multpl.com), monthly with a current estimate
    erp: 45                # Damodaran implied equity risk premium, monthly
    ecb: 14
    putcall: 7             # CBOE daily put/call ratios
    aaii: 14               # AAII weekly sentiment survey
    fundamentals_edgar: 45 # financial statements (SEC EDGAR): fetched per company as new reports come out
    fundamentals_yahoo: 45 # financial statements (Yahoo)
    factors: 45            # French and JKP histories: their age is since the last download (the data itself lags months)
  blind_spots:             # what the radar does not see; shown on the page and in summary.json
    - "Valuation comes from Yahoo's consensus estimates (unofficial, weekly snapshots) and, for the US market, Shiller's CAPE and Damodaran's risk premium. Its own history for stocks and ETFs only starts with the first snapshot, so percentiles and revisions take weeks to appear."
    - "Earnings revisions: FactSet for the S&P 500; elsewhere only changes in Yahoo's consensus between snapshots (names that report in another currency than they trade in are left out, as Yahoo converts their estimates at today's rate)."
    - "Flows and sentiment: no fund flows, fund manager survey, short interest or insider activity. Sentiment is the AAII survey and CBOE put/call ratios, both US-centred."
    - "Macro and credit are mostly US (FRED). Europe is seen through the euro high-yield spread, the euro-area 10Y yield (ECB), the OECD leading indicator and price trends; no euro-area inflation (the official series stops at Dec 2025 in the free sources)."
    - "Company fundamentals come from financial statements: SEC EDGAR (official, US only) and Yahoo (unofficial, about four years deep, half-yearly for many European companies). IFRS and US GAAP differ (leases, R&D), one-off items are taken as reported, and guidance is not modelled."
    - "The universe is a sample: US = today's S&P 500, so breadth history has survivorship bias; Europe, Nordic and Asia are curated lists."
    - "Discover widens the search (Nordic and European listings from Yahoo's screener, the STOXX 600, positive-list ETFs), but it is still Yahoo data: small caps are noisier, thinly traded names can jump, and today's list has no delisted names."
    - "News, events and policy only enter through the web research in /market-brief."
    - "Yahoo data is unofficial and comes without a quality guarantee. All prices are end-of-day."

network:                   # src/radar/net.py: every external request is paced per host, recorded (ops.db) and retried
  default:                 # any host not listed below
    rate: 4                # requests a second (token bucket) ...
    burst: 8               # ... with this many allowed at once after a quiet spell
    concurrency: 4         # parallel requests at most
    retries: 2             # plain HTTP only: 429, 5xx, timeouts and connection errors; exponential backoff + Retry-After
    backoff: 2             # seconds before the first retry (doubles, plus jitter)
    max_wait: 120          # a Retry-After longer than this gives up instead of blocking the step
    budget: null           # soft daily request count; going over is a warning on the Operations page, never a block
  hosts:                   # glob patterns, first match wins; hosts matching one pattern share its limits
    "*.yahoo.com": {rate: 5, burst: 10, concurrency: 4, budget: 20000}   # yfinance (its own retries)
    "fred.stlouisfed.org": {rate: 2, burst: 4}
    "cdn.cboe.com": {rate: 4, burst: 4, concurrency: 1}
    "advantage.factset.com": {rate: 1, burst: 2, concurrency: 1}
    "www.multpl.com": {rate: 0.5, burst: 1, concurrency: 1}
    "pages.stern.nyu.edu": {rate: 0.5, burst: 1, concurrency: 1}
    "www.aaii.com": {rate: 0.5, burst: 1, concurrency: 1}
    "api.github.com": {rate: 0.2, burst: 1, concurrency: 1}              # the opt-in check for a new version
    "*.sec.gov": {rate: 5, burst: 5, concurrency: 2, budget: 3000}        # SEC EDGAR; SEC's fair-access limit is 10/s
    "mba.tuck.dartmouth.edu": {rate: 0.5, burst: 2, concurrency: 1}       # Kenneth R. French Data Library
    "jkpfactors-data.s3.amazonaws.com": {rate: 1, burst: 2, concurrency: 1}  # JKP Global Factor Data
  cooldown:                # pause a host that keeps answering 429 (shared by the app and the CLI through ops.db)
    trip: 3                # this many 429s ...
    window_min: 10         # ... within this many minutes
    cooldown_min: 15       # first pause; doubles for each repeat within a day
    max_cooldown_min: 120

factors:                   # src/radar/factors.py: long monthly histories for `radar study longrun` (no survivorship bias)
  max_age_days: 30         # a dataset is downloaded again when its copy is older than this (the sources update monthly)
  french:                  # Kenneth R. French Data Library: name -> ZIP file (and the block, when not the first)
    ind49: {file: 49_Industry_Portfolios_CSV, block: Average Value Weighted Returns -- Monthly}   # US, 1926-
    mom10_us: {file: 10_Portfolios_Prior_12_2_CSV, block: Average Equal Weighted Returns -- Monthly}  # momentum deciles
    ff3_us: F-F_Research_Data_Factors_CSV     # Mkt-RF, SMB, HML, RF (the T-bill), US, 1926-
    mom_us: F-F_Momentum_Factor_CSV           # Mom (UMD), US, 1927-
    ff3_dev: Developed_3_Factors_CSV          # developed markets, 1990-
    mom_dev: Developed_Mom_Factor_CSV
    ff3_eu: Europe_3_Factors_CSV
    mom_eu: Europe_Mom_Factor_CSV
  jkp:                     # JKP Global Factor Data (CC BY-NC 4.0): USD returns in excess of the US T-bill
    mkt_countries: {region: all_countries, theme: mkt, weighting: vw}            # market return per country
    mkt_world: {region: world, theme: mkt, weighting: vw}
    themes_developed: {region: developed, theme: all_themes, weighting: vw_cap, series: name}  # 13 factor themes
    themes_world_ex_us: {region: world_ex_us, theme: all_themes, weighting: vw_cap, series: name}
    themes_usa: {region: usa, theme: all_themes, weighting: vw_cap, series: name}
  jkp_portfolios:          # JKP's long-only terciles per characteristic and region: the proposals' long-run prior
    weighting: vw_cap
    regions: [developed, world_ex_us, usa]
    characteristics: [ret_12_1, ret_6_1, fcf_me, ebitda_mev, eqnpo_me, qmj]

longrun:                   # src/radar/backtest/longrun.py: `radar study longrun` (pre-registered: set before the first run)
  holdout_from: 2008-01-01 # formation months from this one on are the holdout (never tuned on)
  horizons: [1, 3, 6, 12]  # months
  regime_months: 10        # the market is "down" on a date when below its 10-month average
  panels:                  # cross-sections the momentum score ranks: a dataset, its members, the market that sets the regime
    french49:
      label: US industries (Fama-French 49, value-weighted)
      data: french:ind49
      market: us
      n_top: 10            # about the top quintile
      min_names: 30
    countries:
      label: Developed-market countries (JKP, value-weighted, USD)
      data: jkp:mkt_countries
      excess: true         # JKP returns are over the T-bill: RF is added back
      market: world
      n_top: 5
      min_names: 15
      members: [aus, aut, bel, can, che, deu, dnk, esp, fin, fra, gbr, hkg, irl, isr, ita, jpn, nld, nor, nzl, prt, sgp, swe, usa]
  factors:                 # long-short factor returns for the base rates: label -> [dataset, series]
    "Momentum, US (Fama-French UMD)": [french:mom_us, Mom]
    "Momentum, developed (Fama-French WML)": [french:mom_dev, WML]
    "Momentum, Europe (Fama-French WML)": [french:mom_eu, WML]
    "Momentum theme, developed (JKP)": [jkp:themes_developed, momentum]
    "Momentum theme, world ex US (JKP)": [jkp:themes_world_ex_us, momentum]
    "Value, US (Fama-French HML)": [french:ff3_us, HML]
    "Value, developed (Fama-French HML)": [french:ff3_dev, HML]
    "Value, Europe (Fama-French HML)": [french:ff3_eu, HML]
    "Value theme, developed (JKP)": [jkp:themes_developed, value]
    "Value theme, world ex US (JKP)": [jkp:themes_world_ex_us, value]
    "Quality theme, developed (JKP)": [jkp:themes_developed, quality]

updates:                   # src/radar/updates.py: the check for a new version (off until switched on in the app)
  repo: mstarch-dk/market-radar   # the public repo's "owner/name" on GitHub; null: nothing to check

ops:                       # the operations log (ops.db in the cache folder, the Operations page, `radar ops`)
  keep_requests_days: 30
  keep_events_days: 180    # events and job runs

valuation:                 # src/radar/valuation.py and signals/valuation.py
  snapshot_days: 6         # a new P/E snapshot when the last one is older than this (weekly)
  fallback_max: 120        # tracked stocks the screener misses, looked up one by one (yfinance .info)
  pe_range: [1, 300]       # a P/E outside this is dropped with a note (a unit or currency mix-up, not a valuation)
  fund_pe_range: [3, 150]
  rel_band: 0.2            # P/E vs sector median: below 1 - band = cheap, above 1 + band = rich
  min_peers: 5             # a sector median needs at least this many names with a P/E
  revision_band: 0.01      # a forward EPS change within +-1% counts as unchanged
  etf_history_weeks: 26    # an ETF's P/E percentile needs this many weekly snapshots
  etf_min_share: 0.8       # a new ETF snapshot needs fund data for this share of the last one's ETFs, else it's kept

fundamentals:              # src/radar/fundamentals/: financial statements (SEC EDGAR for US companies, Yahoo for all)
  edgar:
    refresh_days: 30       # fetch a company's facts again after this many days ...
    after_period_days: 45  # ... or once a quarter plus this many days has passed since its latest period end
    max_per_run: 200       # companies per update (the first backfill is spread over a few updates)
    tickers_max_age_days: 30   # SEC's ticker -> CIK list is fetched again after this
    max_fail_share: 0.2    # more than this share of the companies failing makes the step fail (what worked is kept)
    years: 12              # fiscal years kept per company
  yahoo:
    refresh_days: 35       # fetch a stock's statements again after this many days ...
    after_earnings_days: 5 # ... or this many days after its earnings date (from the valuation snapshot)
    max_per_run: 150       # stocks per update (8 requests each)
    min_ok_share: 0.5      # fewer answering stocks than this share makes the step fail (what worked is kept)
    assumed_lag_days: {quarterly: 45, annual: 75}   # a first fetch's values: assumed public this long after the period end
  # the kvalitetsscore and værdiscore (signals/fundamentals.py, fundamentals/context.py)
  top_n: 20                # names per region on the Quality & value page
  min_sector_peers: 8      # a metric is ranked within the sector (all regions pooled) when this many peers have it, else in the whole set
  financial_industries: [Banks - Diversified, Banks - Regional, Insurance - Life, Insurance - Property & Casualty,
                         Insurance - Diversified, Insurance - Reinsurance, Insurance - Specialty, Mortgage Finance]
  ttm_max_age_days: 200    # a last-twelve-months figure (or balance) ending longer ago than this is left out
  annual_max_age_days: 460 # the latest fiscal year must end within this for the stability metrics
  stability_years: 5       # fiscal years behind margin spread, revenue steadiness and ROE spread ...
  min_fy_points: 4         # ... of which at least this many
  ey_history_years: 5      # EBIT/EV (E/P) against the company's own fiscal year-ends this far back ...
  ey_history_min_points: 4 # ... with at least this many points, today included
  interest_cover_cap: 100  # EBIT / interest above this counts as this (and next to no debt as the cap)
  shares_low: 0.7          # reported shares outside shares_low–shares_high times diluted shares: diluted shares are used
  shares_high: 1.3
  mcap_check: 0.25         # our market value further than this from Yahoo's: Yahoo's is used (noted)
  ranges:                  # a metric outside its range is a unit or data error: left out, with a note
    fcf_margin: [-2, 1]
    roic: [-1, 2]
    nd_ebitda: [-20, 20]
    fcf_yield: [-0.5, 0.5]
    ebit_ev: [-1, 1]
    shareholder_yield: [-0.5, 0.5]
    roe: [-1, 1]
  quality:
    weights: {profitability: 0.35, durability: 0.25, balance: 0.25, record: 0.15}
    min_pillars: 3         # a kvalitetsscore needs this many of the four pillars ...
    required: [profitability]   # ... including these
  value:
    weights: {fcf_yield: 0.3, ebit_ev: 0.3, shareholder_yield: 0.2, ey_vs_history: 0.2}
    min_components: 3      # a værdiscore needs this many of its four metrics ...
    required_any: [fcf_yield, ebit_ev]   # ... one of these among them
  financial_value:         # banks and insurers
    weights: {bp: 0.3, ep: 0.3, shareholder_yield: 0.2, ep_vs_history: 0.2}
    min_components: 3
    required_any: [bp, ep]

sentiment:                 # src/radar/sentiment.py
  putcall_backfill_days: 365
  putcall_retry_days: 10   # a weekday in this window that isn't stored (not published yet, refused) is asked again
  putcall_lookback_days: 756   # percentile of the 10-day average equity put/call over ~3 years
  aaii_extreme_pct: 10         # bull-bear spread percentile at or below = extreme fear, at or above 100-x = euphoria

gauges:                    # graded readings (signals/gauges.py): colour by closeness to a threshold, not just a word
  # anchors: [value, score] points; score +1 = good/bullish/cheap (green), -1 = warning (red), interpolated between.
  # sequential gauges are one-way risk measures (scores 0..-1 only). labels: [upper bound, word], last bound null.
  # unit: pct for fractions shown as percentages (default num).
  rsi14:
    scale: diverging
    anchors: [[20, 1], [30, 0.6], [40, 0.15], [45, 0], [55, 0], [60, -0.15], [70, -0.6], [80, -1]]
    labels: [[30, oversold], [40, near oversold], [60, neutral], [70, near overbought], [80, overbought], [null, extremely overbought]]
    ticks: [30, 70]
    range: [0, 100]
  bb_pct_b:
    scale: diverging
    anchors: [[-0.1, 0.8], [0, 0.5], [0.35, 0], [0.65, 0], [1, -0.5], [1.1, -0.9]]
    labels: [[0, below lower band], [0.35, lower half], [0.65, mid band], [1, upper half], [null, above upper band]]
    ticks: [0, 1]
    range: [-0.2, 1.2]
  macd_atr:                # MACD histogram divided by ATR, so it compares across prices
    scale: diverging
    anchors: [[-0.5, -1], [-0.1, -0.3], [0, 0], [0.1, 0.3], [0.5, 1]]
    labels: [[-0.1, bearish], [0, fading], [0.1, turning up], [null, bullish]]
    ticks: [0]
    range: [-0.6, 0.6]
  atr_pct:
    scale: sequential
    unit: pct
    anchors: [[0.01, 0], [0.025, -0.2], [0.04, -0.5], [0.07, -1]]
    labels: [[0.015, calm], [0.03, normal], [0.05, volatile], [null, very volatile]]
    ticks: [0.025, 0.04]
    range: [0, 0.08]
  vol_surge:
    scale: sequential
    anchors: [[1, 0], [1.5, -0.3], [2.5, -0.8]]
    labels: [[1.3, normal volume], [2, elevated volume], [null, unusual volume]]
    ticks: [1, 1.5]
    range: [0, 3]
  from_high:
    scale: diverging
    unit: pct
    anchors: [[-0.35, -1], [-0.2, -0.4], [-0.1, 0], [-0.05, 0.3], [0, 0.6]]
    labels: [[-0.2, deep drawdown], [-0.1, pulled back], [-0.03, near high], [null, at 52w high]]
    ticks: [-0.2, -0.1]
    range: [-0.4, 0]
  beta:
    scale: sequential
    anchors: [[1, 0], [1.5, -0.4], [2, -0.8]]
    labels: [[0.8, defensive], [1.2, market-like], [1.7, high beta], [null, very high beta]]
    ticks: [1]
    range: [0, 2.5]
  score:
    scale: diverging
    anchors: [[0, -1], [25, -0.5], [40, 0], [60, 0], [80, 0.6], [95, 1]]
    labels: [[25, weak], [40, below average], [60, average], [80, strong], [null, leader]]
    ticks: [40, 60, 80]
    range: [0, 100]
  quality_score:           # kvalitetsscore (signals/fundamentals.py), a mean of percentiles like the momentum score
    scale: diverging
    anchors: [[0, -1], [25, -0.5], [40, 0], [60, 0], [80, 0.6], [95, 1]]
    labels: [[25, weak], [40, below average], [60, average], [80, strong], [null, top quality]]
    ticks: [40, 60, 80]
    range: [0, 100]
  value_score:             # værdiscore: high = cheap against peers
    scale: diverging
    anchors: [[0, -1], [25, -0.5], [40, 0], [60, 0], [80, 0.6], [95, 1]]
    labels: [[25, expensive], [40, above peers], [60, in line], [80, cheap], [null, very cheap]]
    ticks: [40, 60, 80]
    range: [0, 100]
  stop_dist:               # stop vs price (negative = stop below the price)
    scale: sequential
    unit: pct
    anchors: [[-0.15, 0], [-0.08, -0.2], [-0.04, -0.6], [-0.015, -1], [0, -1]]
    labels: [[-0.08, room to the level], [-0.04, getting close], [0, near the level], [null, below the level]]
    ticks: [-0.08, -0.04]
    range: [-0.2, 0]
  tp_dist:                 # take-profit vs price (positive = target above the price)
    scale: diverging
    unit: pct
    anchors: [[0, 1], [0.03, 0.7], [0.1, 0.3], [0.3, 0]]
    labels: [[0, at target], [0.03, near target], [0.1, approaching], [null, far from target]]
    ticks: [0.03, 0.1]
    range: [0, 0.4]
  upside:                  # analysts' mean target vs price
    scale: diverging
    unit: pct
    anchors: [[-0.2, -1], [-0.05, -0.4], [0, 0], [0.05, 0], [0.15, 0.4], [0.3, 1]]
    labels: [[-0.05, above targets], [0.05, at targets], [0.15, some upside], [null, well below targets]]
    ticks: [0, 0.15]
    range: [-0.3, 0.4]
  target_change:
    scale: diverging
    unit: pct
    anchors: [[-0.1, -1], [0, 0], [0.1, 1]]
    labels: [[-0.02, targets cut], [0.02, targets stable], [null, targets raised]]
    ticks: [0]
    range: [-0.15, 0.15]
  cot_pct:                 # crowding: graded by distance from the middle of the 3-year range
    scale: sequential
    abs_from: 50
    anchors: [[50, 0], [75, -0.2], [90, -0.6], [100, -1]]
    labels: [[10, crowded short], [25, leaning short], [75, normal], [90, leaning long], [null, crowded long]]
    ticks: [10, 50, 90]
    range: [0, 100]
  cli_chg:
    scale: diverging
    anchors: [[-0.5, -1], [0, 0], [0.5, 1]]
    labels: [[-0.1, slowing], [0.1, flat], [null, improving]]
    ticks: [0]
    range: [-0.8, 0.8]
  rs_ratio:
    scale: diverging
    anchors: [[97, -1], [100, 0], [103, 1]]
    labels: [[99, lagging], [101, even], [null, leading]]
    ticks: [100]
    range: [96, 104]
  rs_mom:
    scale: diverging
    anchors: [[98, -1], [100, 0], [102, 1]]
    labels: [[99.5, decelerating], [100.5, steady], [null, accelerating]]
    ticks: [100]
    range: [97, 103]
  excess_vs_acwi:          # holding's DKK return minus the shadow ACWI position's
    scale: diverging
    unit: pct
    anchors: [[-0.2, -1], [0, 0], [0.2, 1]]
    labels: [[-0.05, behind ACWI], [0.05, level with ACWI], [null, ahead of ACWI]]
    ticks: [0]
    range: [-0.4, 0.4]
  # valuation and sentiment (signals/valuation.py); +1 = cheap / supportive, -1 = stretched
  pe_vs_sector:            # forward P/E divided by its sector's median in the same region
    scale: diverging
    anchors: [[0.5, 1], [0.8, 0.5], [1, 0], [1.25, -0.5], [2, -1]]
    labels: [[0.8, cheap vs sector], [0.95, a little cheaper], [1.05, in line], [1.25, a little dearer], [null, rich vs sector]]
    ticks: [0.8, 1, 1.25]
    range: [0.3, 2.5]
  pe_vs_acwi:              # an ETF's P/E divided by ACWI's
    scale: diverging
    anchors: [[0.5, 1], [0.8, 0.5], [1, 0], [1.25, -0.5], [2, -1]]
    labels: [[0.8, cheaper than ACWI], [0.95, a little cheaper], [1.05, like ACWI], [1.25, a little dearer], [null, dearer than ACWI]]
    ticks: [0.8, 1, 1.25]
    range: [0.3, 2.5]
  pe_pct:                  # an ETF's P/E against its own stored history (percentile)
    scale: diverging
    anchors: [[0, 1], [20, 0.5], [50, 0], [80, -0.5], [100, -1]]
    labels: [[20, low for it], [80, normal for it], [null, high for it]]
    ticks: [20, 50, 80]
    range: [0, 100]
  eps_rev:                 # change in the next-year EPS estimate between snapshots
    scale: diverging
    unit: pct
    anchors: [[-0.1, -1], [-0.02, -0.4], [0, 0], [0.02, 0.4], [0.1, 1]]
    labels: [[-0.03, cut], [-0.01, trimmed], [0.01, unchanged], [0.03, nudged up], [null, raised]]
    ticks: [0]
    range: [-0.15, 0.15]
  revision_breadth:        # % of names with higher minus lower EPS estimates
    scale: diverging
    unit: pct
    anchors: [[-0.4, -1], [-0.1, -0.3], [0, 0], [0.1, 0.3], [0.4, 1]]
    labels: [[-0.2, mostly cut], [-0.05, more cuts], [0.05, balanced], [0.2, more raised], [null, mostly raised]]
    ticks: [0]
    range: [-0.6, 0.6]
  cape_pct:                # Shiller CAPE percentile since 1871: high = stretched
    scale: diverging
    anchors: [[0, 1], [10, 0.6], [50, 0], [90, -0.6], [100, -1]]
    labels: [[10, cheap], [30, below average], [70, average], [90, above average], [null, stretched]]
    ticks: [10, 50, 90]
    range: [0, 100]
  erp_pct:                 # implied equity risk premium percentile: low = thin premium for owning stocks
    scale: diverging
    anchors: [[0, -1], [10, -0.6], [50, 0], [90, 0.6], [100, 1]]
    labels: [[10, thin premium], [30, below average], [70, average], [90, above average], [null, ample premium]]
    ticks: [10, 50, 90]
    range: [0, 100]
  yield_gap:               # forward earnings yield minus the 10Y real yield (pct pts)
    scale: diverging
    anchors: [[0, -1], [1.5, -0.4], [3, 0], [4.5, 0.4], [6, 1]]
    labels: [[1.5, thin], [3, below average], [4.5, average], [null, wide]]
    ticks: [1.5, 3, 4.5]
    range: [-1, 8]
  aaii_pct:                # bull-bear spread percentile; contrarian: fear is green, euphoria red
    scale: diverging
    anchors: [[0, 1], [10, 0.6], [50, 0], [90, -0.6], [100, -1]]
    labels: [[10, extreme fear], [30, fearful], [70, normal], [90, optimistic], [null, euphoria]]
    ticks: [10, 50, 90]
    range: [0, 100]
  putcall_pct:             # equity put/call 10-day average percentile; contrarian: heavy put buying is green
    scale: diverging
    anchors: [[0, -1], [10, -0.6], [50, 0], [90, 0.6], [100, 1]]
    labels: [[10, complacent], [30, calm], [70, normal], [90, hedging], [null, fearful]]
    ticks: [10, 50, 90]
    range: [0, 100]

macro:
  yahoo:
    VIX: ^VIX
    USDDKK: USDDKK=X
    EURDKK: EURDKK=X
    VIX3M: ^VIX3M            # 3-month VIX: VIX/VIX3M > 1 = stress (inverted term structure)
    Oil (WTI): CL=F
    Copper: HG=F
    Gold: GC=F               # copper/gold ratio: growth vs. defence
    Equal-weight S&P: RSP    # RSP/SPY: how broad US leadership is
  fred:                     # public CSV endpoint, no API key needed
    DGS10: US 10Y yield
    T10Y2Y: US 10Y-2Y curve
    BAMLH0A0HYM2: US high-yield spread
    DTWEXBGS: USD broad index
    DGS3MO: US 3-month T-bill (risk-free rate for Sharpe/alpha)
    BAMLHE00EHYIOAS: Euro high-yield spread (ICE BofA; FRED keeps only ~3 years)
    DFII10: US 10Y real yield (TIPS)
    T10YIE: US 10Y breakeven inflation
  fred_views:               # only read by the market-views evidence check (not the regime; slower cadence is fine)
    ECBDFR: ECB deposit facility rate
    IRLTLT01EZM156N: Euro area 10Y government yield (monthly)
  fred_study:               # only read by `radar study longrun` (long histories; never the regime)
    DEXDNUS: DKK per USD (daily, from 1971)
    USREC: US recession months (NBER)

# Non-price data (src/radar/external.py), all free and keyless.
external:
  ecb:                      # ECB Data Portal (SDMX, CSV): key -> [series key, label]
    EA10Y: ["YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y", "Euro area 10Y yield (AAA curve, spot)"]
  cot:                      # CFTC Commitments of Traders: market name -> CFTC contract code
    tff:                    # Traders in Financial Futures (asset managers, leveraged funds)
      S&P 500: "13874A"
      Nasdaq-100: "209742"
      Russell 2000: "239742"
      US 10Y note: "043602"
      Euro FX: "099741"
      VIX: "1170E1"
    disagg:                 # Disaggregated report (managed money)
      Gold: "088691"
      WTI crude: "067651"
      Copper: "085692"
  oecd_cli:                 # OECD Composite Leading Indicators: area code -> label
    G20: G20
    USA: United States
    G4E: Europe big 4         # DE, FR, IT, UK; OECD no longer publishes euro-area or Danish CLIs
    CHN: China

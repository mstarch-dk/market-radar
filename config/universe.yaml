# What the radar watches. Tickers are Yahoo Finance symbols.
# UCITS tickers/ISINs are suggestions – verify on justETF before acting.
# Add `isin:` to an ETF to get a Danish positive-list flag (needs imports/positivliste.xlsx).

benchmark:
  ticker: ACWI          # iShares MSCI ACWI (US-listed, used for calculations)
  name: MSCI ACWI
  ucits: SSAC.L         # iShares MSCI ACWI UCITS (Acc)
  isin: IE00B6R52259


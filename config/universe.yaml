# What the radar watches. Tickers are Yahoo Finance symbols.
# UCITS tickers/ISINs are suggestions – verify on justETF before acting.
# Add `isin:` to an ETF to get a Danish positive-list flag (needs imports/positivliste.xlsx).

benchmark:
  ticker: ACWI          # iShares MSCI ACWI (US-listed, used for calculations)
  name: MSCI ACWI
  ucits: SSAC.L         # iShares MSCI ACWI UCITS (Acc)
  isin: IE00B6R52259

# Your own extra tickers to always track (Yahoo CSV holdings/watchlist are added automatically)
watchlist: []

# Ticker profile (radar ticker / radar info): the sector ETF a stock is compared with, by Yahoo sector.
# `industries` overrides by industry prefix; a sector without an entry gets no sector comparison.
sector_etfs:
  us:
    Technology: XLK
    Communication Services: XLC
    Consumer Cyclical: XLY
    Consumer Defensive: XLP
    Financial Services: XLF
    Healthcare: XLV
    Industrials: XLI
    Energy: XLE
    Basic Materials: XLB
    Utilities: XLU
    Real Estate: XLRE
  europe:                   # also used for Nordic stocks
    Technology: EXV3.DE
    Healthcare: EXV4.DE
    Financial Services: EXH2.DE
    Industrials: EXH4.DE
    Basic Materials: EXV6.DE
    Energy: EXH1.DE
    Utilities: EXH9.DE
    Communication Services: EXV2.DE
    Consumer Defensive: EXH3.DE
    industries:
      Banks: EXV1.DE
      Insurance: EXH5.DE
      Auto: EXV5.DE
      Specialty Chemicals: EXV7.DE
      Chemicals: EXV7.DE
      Building: EXV8.DE
      Travel: EXV9.DE
      Lodging: EXV9.DE
      Restaurants: EXV9.DE

# Attribution vs ACWI (portfolios/segments.py, plans/F4-attribution.md): the ETFs that stand in for ACWI's segments,
# since ACWI's own sector and region returns aren't free. Prices only; nothing here is shown as a group.
attribution:
  sectors:                           # MSCI World sector UCITS (Xtrackers 1C, accumulating, Xetra, from 2016-04)
    Technology: XDWT.DE
    Healthcare: XDWH.DE
    Financial Services: XDWF.DE      # from 2017-04
    Industrials: XDWI.DE
    Consumer Cyclical: XDWC.DE
    Consumer Defensive: XDWS.DE
    Energy: XDW0.DE
    Basic Materials: XDWM.DE
    Utilities: XDWU.DE
    Communication Services: XWTS.DE  # the sector has its present form since 2018-09
    Real Estate: SPYJ.DE             # SPDR Dow Jones Global Real Estate: no MSCI World real estate UCITS on Yahoo
  sector_fallback: us                # before a proxy's first price: that sector in sector_etfs.us
  regions:                           # country ETFs, mixed by ACWI's country weights inside each region
    us: {United States: SPY}
    nordic: {Denmark: EDEN, Sweden: EWD, Norway: ENOR, Finland: EFNL}
    europe: {United Kingdom: EWU, Germany: EWG, Switzerland: EWL, Ireland: EIRL, France: EWQ, Netherlands: EWN,
             Spain: EWP, Italy: EWI}
    asia: {Japan: EWJ, Taiwan: EWT, Korea: EWY, China: MCHI, Singapore: EWS, Hong Kong: EWH, India: INDA}
    other: {Canada: EWC, Australia: EWA, South Africa: EZA, Israel: EIS, Mexico: EWW}


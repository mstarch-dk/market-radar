# Index funds Yahoo can't look through (portfolios/exposure.py): mostly Danish investment funds
# (investeringsforeninger), which Yahoo lists as stocks with no sector and no fund data. Each fund is counted as the
# index it tracks, built as a slice of ACWI's own holdings (the iShares MSCI ACWI holdings file): the index's
# countries, re-weighted to sum to 1. That gives its sector, region and currency weights in the X-ray, the
# attribution and the proposals. A share class hedged to a currency (`hedged: DKK`) has that currency as its
# currency exposure; its sectors and regions are still the index's.
#
# An approximation, and the notes say so: ACWI holds large and mid caps only, so an "all cap" index is read as its
# large and mid caps; an ESG, climate or screened variant as its parent index; STOXX Europe 600 as MSCI Europe; a
# capped Danish index (OMXC Cap, OMXC25, OMXC All Cap) as ACWI's Danish stocks without the cap. Left out on purpose,
# because a country slice of ACWI would misstate them: small-cap, growth, value, minimum-volatility, GDP-weighted,
# sector or theme indexes, "ex OMXC20" and narrow leader indexes. A fund that isn't here is never guessed: Yahoo
# lists it as a stock without a sector, and it stays "unknown".
#
# Tickers are Yahoo Finance symbols (the Nasdaq Copenhagen short name + .CO), each checked to have prices on Yahoo
# (2026-10-28). The benchmark and hedging of each come from the provider's factsheet, annual report or fund page,
# read 2026-10-28 (Danske Invest, Sparindex, Nordea Invest, BankInvest, Sydinvest). Country names are English, as
# constituents.country_en gives them. The list is the listed Danish index equity funds found, not anyone's holdings.

indexes:
  msci_world:
    label: MSCI World
    countries: &developed [United States, Canada, United Kingdom, Ireland, Germany, France, Netherlands, Switzerland,
                           Spain, Italy, Belgium, Austria, Portugal, Denmark, Sweden, Norway, Finland, Japan,
                           Australia, Hong Kong, Singapore, New Zealand, Israel]
  msci_acwi:
    label: MSCI ACWI
    countries: all
    note: "India, Brazil and Saudi Arabia are held through funds in ACWI's holdings file, so they are missing from it"
  msci_usa:
    label: MSCI USA
    countries: [United States]
  msci_north_america:
    label: MSCI North America
    countries: [United States, Canada]
  msci_europe:
    label: MSCI Europe
    countries: &europe [United Kingdom, Ireland, Germany, France, Netherlands, Switzerland, Spain, Italy, Belgium,
                        Austria, Portugal, Denmark, Sweden, Norway, Finland]
  msci_nordic:
    label: MSCI Nordic
    countries: [Denmark, Sweden, Norway, Finland]
  denmark:
    label: Danish stocks
    countries: [Denmark]
    note: "read as ACWI's Danish large and mid caps, without the index's cap or its smaller companies"
  msci_germany:
    label: MSCI Germany
    countries: [Germany]
  msci_japan:
    label: MSCI Japan
    countries: [Japan]
  msci_pacific_ex_japan:
    label: MSCI Pacific ex Japan
    countries: [Australia, Hong Kong, Singapore, New Zealand]
  msci_em:
    label: MSCI Emerging Markets
    countries: all
    exclude: *developed
    note: "India, Brazil and Saudi Arabia are held through funds in ACWI's holdings file, so the slice leaves them out
      and leans towards China, Taiwan and Korea"


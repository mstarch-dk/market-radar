# Sector ETFs (plans/F13-sector-etfs.md): the sectors the Sector ETFs page covers, and where each one shows up in
# the rotation overview. /sector-etfs records a go-to UCITS ETF and its peers per sector in the data folder
# (exports/sector_etfs/); this file is only the map and a starting point, not a recommendation.
#
# Keys: the 11 GICS sectors use Yahoo's sector names, as universe.yaml `sector_etfs` and `attribution.sectors` do,
# so a stock's sector and an X-ray row find their entry by name. The EU supersectors (STOXX Europe 600) that have
# their own UCITS ETF are entries of their own, with `parent:` the GICS sector they belong to.
# `rotation:` the tickers of etf_groups.us_sectors / eu_sectors (universe.yaml) that stand for the sector there;
# every one of them belongs to exactly one entry (tests/test_config.py).
#
# `match:` words (upper case) a fund's name holds to be offered from the discovery pool (positive-list funds the
# scan mapped to Yahoo) as a further candidate for the skill; leveraged, short and bond funds are left out.
# `seeds:` known UCITS candidates the skill starts from, never a pick. Each ISIN is on SKAT's positive list (2026
# sheet, imports/positivliste.xlsx) and each ticker is the Yahoo listing the discovery scan mapped it to
# (discovery/isin_map.csv), both read 2026-11-20. TER, size and tracking are not kept here: the skill records them
# with their source and date. `scope`: what the fund holds (world = MSCI World, us = S&P 500, europe = Europe).

sectors:
  Technology:
    label: Teknologi
    rotation: [XLK, EXV3.DE]
    match: ["INFORMATION TECHNOLOGY", "TECHNOLOGY"]
    seeds:
      - {isin: IE00BM67HT60, ticker: XDWT.L,  scope: world,  name: Xtrackers MSCI World Information Technology UCITS ETF 1C}
      - {isin: IE00BJ5JNY98, ticker: WITS.AS, scope: world,  name: iShares MSCI World Information Technology Sector Advanced UCITS ETF (Dist)}
      - {isin: IE00B3WJKG14, ticker: IUIT.L,  scope: us,     name: iShares S&P 500 Information Technology Sector UCITS ETF (Acc)}
      - {isin: DE000A0H08Q4, ticker: EXV3.DE, scope: europe, name: iShares STOXX Europe 600 Technology UCITS ETF (DE)}
      - {isin: LU0292104469, ticker: XS8R.DE, scope: europe, name: Xtrackers MSCI Europe Information Technology UCITS ETF 1C}
  Healthcare:
    label: Sundhed
    rotation: [XLV, EXV4.DE]
    match: ["HEALTH CARE", "HEALTHCARE"]
    seeds:
      - {isin: IE00BM67HK77, ticker: XDWH.L,  scope: world,  name: Xtrackers MSCI World Health Care UCITS ETF 1C}
      - {isin: IE00B43HR379, ticker: IUHC.L,  scope: us,     name: iShares S&P 500 Health Care Sector UCITS ETF (Acc)}
      - {isin: DE000A0Q4R36, ticker: EXV4.DE, scope: europe, name: iShares STOXX Europe 600 Health Care UCITS ETF (DE)}
      - {isin: LU0292103222, ticker: DXSE.DE, scope: europe, name: Xtrackers MSCI Europe Health Care UCITS ETF 1C}
  Financial Services:
    label: Finans
    rotation: [XLF, EXH2.DE]
    match: ["FINANCIALS", "FINANCIAL SERVICES"]
    seeds:
      - {isin: IE00BM67HL84, ticker: XDWF.L,  scope: world,  name: Xtrackers MSCI World Financials UCITS ETF 1C}
      - {isin: IE00BJ5JP097, ticker: WFNS.AS, scope: world,  name: iShares MSCI World Financials Sector Advanced UCITS ETF (Dist)}
      - {isin: IE00B4JNQZ49, ticker: IUFS.L,  scope: us,     name: iShares S&P 500 Financials Sector UCITS ETF (Acc)}
      - {isin: DE000A0H08G5, ticker: EXH2.DE, scope: europe, name: iShares STOXX Europe 600 Financial Services UCITS ETF (DE)}
      - {isin: LU0292103651, ticker: XS7R.DE, scope: europe, name: Xtrackers MSCI Europe Financials UCITS ETF 1C}
  Industrials:
    label: Industri
    rotation: [XLI, EXH4.DE]
    match: ["INDUSTRIALS", "INDUSTRIAL GOODS"]
    seeds:
      - {isin: IE00BM67HV82, ticker: XDWI.L,  scope: world,  name: Xtrackers MSCI World Industrials UCITS ETF 1C}
      - {isin: IE00B4LN9N13, ticker: 2B7C.DE, scope: us,     name: iShares S&P 500 Industrials Sector UCITS ETF (Acc)}
      - {isin: DE000A0H08J9, ticker: EXH4.DE, scope: europe, name: iShares STOXX Europe 600 Industrial Goods & Services UCITS ETF (DE)}
      - {isin: LU0292106084, ticker: DXSL.DE, scope: europe, name: Xtrackers MSCI Europe Industrials UCITS ETF 1C}
  Consumer Cyclical:
    label: Cyklisk forbrug
    rotation: [XLY]
    match: ["CONSUMER DISCRETIONARY"]
    seeds:
      - {isin: IE00BM67HP23, ticker: XDWC.L,  scope: world,  name: Xtrackers MSCI World Consumer Discretionary UCITS ETF 1C}

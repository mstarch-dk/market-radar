  Communication Services:
    label: Kommunikation
    rotation: [XLC, EXV2.DE]
    match: ["COMMUNICATION", "TELECOM"]
    seeds:
      - {isin: IE00BM67HR47, ticker: XWTS.L,  scope: world,  name: Xtrackers MSCI World Communication Services UCITS ETF 1C}
      - {isin: IE00BDDRF478, ticker: IUCM.L,  scope: us,     name: iShares S&P 500 Communication Sector UCITS ETF (Acc)}
      - {isin: DE000A0H08R2, ticker: EXV2.DE, scope: europe, name: iShares STOXX Europe 600 Telecommunications UCITS ETF (DE)}
  Real Estate:
    label: Ejendomme
    rotation: [XLRE]
    match: ["REAL ESTATE", "PROPERTY"]

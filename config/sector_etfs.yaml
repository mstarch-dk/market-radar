    seeds:
      - {isin: IE00BM67HN09, ticker: XDWS.L,  scope: world,  name: Xtrackers MSCI World Consumer Staples UCITS ETF 1C}
      - {isin: IE00B40B8R38, ticker: 2B7D.DE, scope: us,     name: iShares S&P 500 Consumer Staples Sector UCITS ETF (Acc)}
  Energy:
    label: Energi
    rotation: [XLE, EXH1.DE]
    match: ["WORLD ENERGY", "S&P 500 ENERGY", "EUROPE ENERGY", "OIL & GAS"]
    seeds:

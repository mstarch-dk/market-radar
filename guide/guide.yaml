# The books served on the app's Guide page (src/radar/guide.py). This file decides order and titles: one Markdown
# file per chapter at guide/<book>/<slug>.md, whose first line is "# <title>" exactly as here. To add, move or
# rename a chapter, edit this file (and the file name for a new slug). tests/test_guide.py checks it all.
# Writing conventions: guide/STIL.md.

books:
  - id: brugervejledning
    title: Brugervejledning
    intro: Sådan bruger du Market Radar, side for side, fra første start til drift og fejlfinding.
    parts:
      - title: Kom i gang
        chapters:
          - {slug: hvad-er-market-radar, title: "Hvad er Market Radar?"}
          - {slug: installation, title: Installation og første start}
          - {slug: data-og-opdatering, title: Data og opdatering}
          - {slug: navigation, title: Sådan finder du rundt}
      - title: Markedet
        chapters:
          - {slug: regime, title: Regime}
          - {slug: sektorrotation, title: Sektorrotation}
          - {slug: temaer-og-faktorer, title: Temaer og faktorer}
          - {slug: momentum, title: Momentum}
          - {slug: kvalitet-og-vaerdi, title: Kvalitet og værdi}
          - {slug: discover, title: Discover}
          - {slug: positionering, title: Positionering og cyklus}
      - title: Dig og dine penge
        chapters:
          - {slug: tickerprofil, title: Tickerprofilen}
          - {slug: beholdninger, title: Mine beholdninger og watchlist}
          - {slug: xray, title: Røntgen af porteføljen}
          - {slug: kalender, title: Kalenderen}
          - {slug: portefolje, title: "Portefølje: handler, kontanter og import"}
          - {slug: portefoljer-og-tags, title: Rigtige og virtuelle porteføljer}
          - {slug: afkast, title: Afkast over tid}
          - {slug: eksperimenter, title: "Eksperimenter: virtuelle porteføljer"}
          - {slug: stop-simulering, title: Simulér stop og take-profit på dine handler}
          - {slug: scoretest, title: Test momentumscoren på historikken}
          - {slug: markedssyn, title: Mine markedssyn}
          - {slug: notesbog, title: "Notesbogen: briefs, research og journal"}
      - title: Data og drift
        chapters:
          - {slug: dine-data, title: "Dine data, backup og opdatering"}
          - {slug: data-og-daekning, title: Data og dækning}
          - {slug: drift, title: "Drift: forespørgsler, fejl og pauser"}

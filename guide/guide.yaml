      - title: IV. Regime og makro
        chapters:
          - {slug: risk-on-risk-off, title: Risk-on og risk-off}
          - {slug: markedsbredde, title: Markedsbredde}
          - {slug: vix, title: VIX og volatilitetens terminsstruktur}
          - {slug: kredit-renter-dollar, title: "Kredit, renter og dollar"}

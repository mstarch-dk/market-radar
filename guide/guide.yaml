          - {slug: maanedsbrief, title: Månedsbriefen}
      - title: Appendiks
        chapters:
          - {slug: indstillinger, title: Indstillinger}
          - {slug: nyheder, title: Nyheder}

  - id: laerebog
    title: Lærebog
    intro: Teorien bag radaren, fra afkast og statistik til momentum, rotation, regime, værdiansættelse, risiko og skat.
    parts:
      - title: I. Grundlag
        chapters:
          - {slug: afkast, title: Afkast og renters rente}

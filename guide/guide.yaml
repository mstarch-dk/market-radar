          - {slug: kvalitet-og-vaerdi, title: "Kvalitet og værdi: Graham, Buffett og Grantham"}
          - {slug: kvalitetsscore, title: Radarens kvalitets- og værdiscore}
      - title: VI. Positionering og sentiment
        chapters:
          - {slug: cot, title: Futurespositionering (CFTC COT)}
          - {slug: sentiment, title: "Put/call og AAII: kontrær sentiment"}
      - title: VII. Risiko og porteføljestyring
        chapters:
          - {slug: volatilitet-og-drawdown, title: "Volatilitet, drawdown, Sharpe og Sortino"}
          - {slug: beta-og-alfa, title: "Beta, alfa og faktorer"}
          - {slug: stop-og-storrelse, title: "Stop-loss, take-profit og positionsstørrelse"}
          - {slug: diversifikation, title: Diversifikation og korrelation}
          - {slug: portefoeljeforslag, title: "Porteføljeforslag: forventet afkast, drawdown og nulhypotesen"}
      - title: VIII. Afkastmåling, adfærd og skat
        chapters:
          - {slug: twr-og-mwr, title: Tidsvægtet og pengevægtet afkast}
          - {slug: adfaerd, title: "Beslutninger, bias og falsifikation"}
          - {slug: skat, title: Dansk skat for investorer}
      - title: Appendiks
        chapters:
          - {slug: formler, title: Formeloversigt}
          - {slug: litteratur, title: Litteratur}


name: Smoke test

# The same steps a new user's computer goes through, on Windows, macOS and Linux.
on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web test
      - run: pnpm -C web build
      - name: radar doctor (offline)
        run: uv run radar doctor --offline

# What the marketing material covers, one entry per feature (the /marketing skill diffs this against the app).
#
# id        stable key, used by shots.yaml (`feature:`) and edition.json
# title     the Danish name in the brochure
# section   the id="…" of the block in site/index.html that describes it
# pages     app routes (web/src/App.tsx) the feature lives on; commands / skills: CLI commands and Claude skills
# shots     images in shots.yaml that show it (check: each exists and is used in index.html)
# since     the PR or commit that added or last changed it in a way the text must reflect

features:
  - id: regime
    title: Markedsregime
    section: regime
    pages: [/regime]
    shots: [regime, regime_charts]

  - id: rotation
    title: Rotationsgrafer (RRG)
    section: rotation
    pages: [/rotation]
    shots: [rotation, rotation_table]

  - id: themes
    title: Temaer og faktorer med UCITS-tjek
    section: themes
    pages: [/themes]
    shots: [themes]

  - id: momentum
    title: Momentum-ledere
    section: momentum
    pages: [/momentum]
    shots: [momentum]

  - id: quality
    title: Kvalitet og værdi
    section: quality
    pages: [/quality, /ticker/:symbol]
    commands: [radar fundamentals, radar abtest]
    shots: [quality, ticker_quality]
    since: "0.2.0"

  - id: evidence
    title: Evidens
    section: evidence
    pages: [/evidence]
    commands: [radar evidence, radar study score, radar study longrun]
    shots: [evidence]
    since: "F2 evidence page"

  - id: discover
    title: Discover (heatmap og screener)
    section: discover
    pages: [/discover]
    commands: [radar discover]
    shots: [discover, discover_table, discover_etfs]
    since: "#12"

  - id: ticker
    title: Tickerprofil
    section: ticker
    pages: [/ticker/:symbol]
    commands: [radar info, radar ticker]
    shots: [ticker_chart, ticker_cards, hover]
    since: "#38"

  - id: views
    title: Mine markedssyn
    section: views
    pages: [/views]
    commands: [radar views]
    shots: [views, ticker_views]
    since: "#13"

  - id: holdings
    title: Beholdninger, watchlist og solgte positioner
    section: holdings
    pages: [/me]
    shots: [holdings, sold]

  - id: calendar
    title: Kalender over regnskaber og egne datoer
    section: calendar
    pages: [/calendar, /]
    commands: [radar calendar]
    skills: [market-brief]
    shots: [calendar]
    since: "F5 calendar"

  - id: portfolio
    title: Porteføljeeditor og import
    section: portfolio
    pages: [/portfolio]
    commands: [radar portfolio, radar import-yahoo]
    shots: [portfolio, import]
    since: "#37"

  - id: xray
    title: Røntgen af porteføljen
    section: xray
    pages: [/xray]
    commands: [radar xray]
    shots: [xray, xray_risk]
    since: "#21"

  - id: returns
    title: Afkast over tid, attribution og eksperimenter
    section: returns
    pages: [/returns, /experiments]
    commands: [radar portfolios, radar performance, radar attribution, radar sim picks]
    shots: [returns, returns_ab, attribution, experiments]
    since: "#32"

  - id: tax
    title: Skatteskøn
    section: tax
    pages: [/portfolio]
    commands: [radar tax]
    shots: [tax]
    since: "#36"

  - id: rules
    title: Mine handelsregler
    section: rules
    pages: [/rules, /me, /portfolio]
    commands: [radar rules]
    skills: [rules, journal]
    shots: [rules, rules_check]
    since: "#41"

  - id: research
    title: Skriftlig research med Claude Code
    section: research
    pages: [/notebook]
    commands: [radar mcp]
    skills: [market-brief, research, compare, journal, rules, propose-portfolio, hindsight]
    shots: []
    since: "#40"

  - id: positioning
    title: Positionering og cyklus
    section: positioning
    pages: [/positioning]
    shots: [positioning]

  - id: data
    title: Data og dækning
    section: data
    pages: [/data, /ops]
    commands: [radar doctor, radar update, radar ops, radar paths, radar backup, radar export]
    shots: [data_home, blindspots]

  - id: interface
    title: Lokal app, lyst/mørkt tema og mobil
    section: interface
    pages: [/]
    shots: [dark_themes, mobile_ticker, mobile_holdings]
